<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Placeholder temporário dos componentes MDX</title>
  <desc id="description">Diagrama de desenvolvimento com os componentes ArticleImage, TwoColumns e Callout.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fafb"/>
      <stop offset="1" stop-color="#fff1e3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb544e"/>
      <stop offset="1" stop-color="#0270ad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="40" fill="url(#background)"/>
  <circle cx="108" cy="92" r="44" fill="#fb544e" opacity="0.12"/>
  <circle cx="1090" cy="510" r="76" fill="#0270ad" opacity="0.1"/>
  <path d="M80 160H1120" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <text x="80" y="105" fill="#4e4d4d" font-family="Arial, sans-serif" font-size="38" font-weight="700">
    Playground temporário de MDX
  </text>
  <text x="80" y="140" fill="#6d6664" font-family="Arial, sans-serif" font-size="20">
    Imagem utilizada somente para validação durante o desenvolvimento
  </text>

  <g filter="url(#shadow)">
    <rect x="80" y="220" width="310" height="230" rx="24" fill="#ffffff" stroke="#e8e8e8" stroke-width="2"/>
    <rect x="445" y="220" width="310" height="230" rx="24" fill="#ffffff" stroke="#e8e8e8" stroke-width="2"/>
    <rect x="810" y="220" width="310" height="230" rx="24" fill="#ffffff" stroke="#e8e8e8" stroke-width="2"/>
  </g>

  <circle cx="235" cy="292" r="36" fill="#fff1e3"/>
  <path d="M216 302l13-14 12 10 15-17 12 21z" fill="#fb544e"/>
  <circle cx="600" cy="292" r="36" fill="#edf6fb"/>
  <path d="M582 278h15v28h-15zm21 0h15v28h-15z" fill="#0270ad"/>
  <circle cx="965" cy="292" r="36" fill="#f1f8f1"/>
  <path d="M965 274a18 18 0 1 0 0 36 18 18 0 0 0 0-36zm-3 25-9-9 4-4 5 5 11-11 4 4z" fill="#348c34"/>

  <text x="235" y="365" text-anchor="middle" fill="#4e4d4d" font-family="Arial, sans-serif" font-size="25" font-weight="700">ArticleImage</text>
  <text x="600" y="365" text-anchor="middle" fill="#4e4d4d" font-family="Arial, sans-serif" font-size="25" font-weight="700">TwoColumns</text>
  <text x="965" y="365" text-anchor="middle" fill="#4e4d4d" font-family="Arial, sans-serif" font-size="25" font-weight="700">Callout</text>

  <text x="235" y="400" text-anchor="middle" fill="#6d6664" font-family="Arial, sans-serif" font-size="17">Imagem e legenda</text>
  <text x="600" y="400" text-anchor="middle" fill="#6d6664" font-family="Arial, sans-serif" font-size="17">Layout responsivo</text>
  <text x="965" y="400" text-anchor="middle" fill="#6d6664" font-family="Arial, sans-serif" font-size="17">Avisos semânticos</text>

  <rect x="80" y="510" width="1040" height="8" rx="4" fill="url(#accent)" opacity="0.7"/>
</svg>
