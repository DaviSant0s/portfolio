<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f141b" />
    <script>
      (function() {
        var storageKey = 'portfolio-theme';
        var storedTheme = localStorage.getItem(storageKey);
        var theme = storedTheme === 'dark' || storedTheme === 'light'
          ? storedTheme
          : 'dark';
        var themeColor = theme === 'dark' ? '#0f141b' : '#ffffff';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.setAttribute('content', themeColor);
        }
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Tipografia principal e subconjunto dos Material Symbols usados pela interface. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..700&display=swap"
      rel="stylesheet"
